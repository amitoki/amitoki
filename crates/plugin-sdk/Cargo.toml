[package]
name = "amitoki-plugin-sdk"
version = "0.2.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
libc = "0.2"
jsonschema = { version = "0.33", default-features = false }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
amitoki-relay = { path = "../relay", version = "0.1.0" }
tokio = { version = "1", features = ["io-std", "io-util", "process", "sync", "time", "rt", "macros"] }
