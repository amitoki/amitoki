name: Resume verified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '公開する既存の版タグ（例: v0.1.0）'
        required: true
        type: string
      run_id:
        description: '検証・両CPUの配布物生成が成功したタグCIのrun ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: resume-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/release -v
      - name: Verify the source CI and resume publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/resume.py --tag "$RELEASE_TAG" --run-id "$RELEASE_RUN_ID" --repository "$RELEASE_REPOSITORY"
