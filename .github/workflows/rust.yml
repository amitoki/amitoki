name: CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Build React Web UI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci
          npm run format:check
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error

  check:
    name: Lint and isolated network tests
    needs: [web]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: bash scripts/test-network.sh
      - name: Exercise experimental L3 over isolated Ethernet links
        env:
          L3_REPETITIONS: 1
          L3_DURATION_MS: 1000
        run: bash scripts/test-l3.sh artifacts/l3/ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: l3-network-verification
          path: artifacts/l3/ci/
          if-no-files-found: ignore
      - name: Compare experimental L3 with Linux UDP over Ethernet
        env:
          L3_REPETITIONS: 1
          L3_DURATION_MS: 1000
        run: bash scripts/compare-l3.sh artifacts/l3-compare/ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: l3-udp-comparison
          path: artifacts/l3-compare/ci/
          if-no-files-found: ignore
      - run: python3 -m unittest discover -s tests/release -v
      - run: python3 -m py_compile tests/vm/*.py tests/vm/guest/*.py scripts/*.py scripts/release/*.py experiments/l3/lab/*.py experiments/l3/comparison/*.py
      - run: bash -n scripts/vm-lab scripts/*.sh tests/vm/guest/*.sh

  package:
    name: Test and package (${{ matrix.target }})
    needs: [web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      - run: cargo test --workspace --locked
      - run: cargo test -p amitoki --no-default-features --locked
      - run: cargo build --release --bin amitoki --locked
      - run: bash scripts/build-packet-rules.sh
      - run: bash scripts/build-telemetry.sh
      - run: bash scripts/build-telemetry-rewrite.sh
      - run: python3 scripts/check-telemetry-rewrite.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify the embedded Web UI in Chromium
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          AMITOKI_WEB_ARTIFACTS=artifacts/web/dev npm run test:dev
      - name: Verify development launcher lifecycle
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          AMITOKI_DEV_BINARY: target/release/amitoki
        run: python3 -m unittest discover -s tests/dev -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: web-ui-verification
          path: artifacts/web/
          if-no-files-found: ignore
      - name: Exercise Rust Pipeline and generated packets
        run: |
          cargo run --locked --example pipeline -- /tmp/amitoki-pipeline.json
          target/release/amitoki plugin stage test ./dist/telemetry --packet telemetry-v1 --count 1000 --json > /tmp/amitoki-generated.jsonl
          target/release/amitoki plugin stage bench ./dist/telemetry --packet telemetry-v1 --count 1000 --json
          target/release/amitoki plugin stage watch ./dist/telemetry --packet telemetry-v1 --count 10 --once --json > /tmp/amitoki-watch-generated.jsonl
      - name: Package and verify both distribution formats
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/release/package.py --target "$RELEASE_TARGET"
          python3 scripts/release/verify.py dist/release --target "$RELEASE_TARGET" --commit "$RELEASE_COMMIT"
      - name: Exercise the archived executable
        run: |
          mkdir -p artifacts/release-extracted
          tar -xzf dist/release/amitoki-*.tar.gz -C artifacts/release-extracted --strip-components=1
          python3 scripts/release/smoke.py --binary artifacts/release-extracted/amitoki --plugin dist/packet-rules
      - name: Install, exercise and remove the deb
        run: |
          sudo apt-get install -y ./dist/release/amitoki_*.deb
          python3 scripts/release/smoke.py --binary /usr/bin/amitoki --plugin dist/packet-rules
          sudo dpkg --remove amitoki
          test ! -e /usr/bin/amitoki
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/*.deb
            dist/release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish version tag
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Verify tag, main ancestry and uploaded assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/publish.py --directory dist/release --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Download public assets anonymously and verify the published release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release/verify_published.py --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --directory artifacts/published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-release-verification
          path: artifacts/published/verification.json
          if-no-files-found: error
