[package]
name = "amitoki-relay-memory"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
amitoki-relay = { path = "../../crates/relay" }
uuid = "1"

[dev-dependencies]
bytes = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
