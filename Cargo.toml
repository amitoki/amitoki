[workspace]
members = ["crates/relay", "crates/plugin-sdk", "plugins/memory", "plugins/packet-rules"]
exclude = ["plugins/postgres", "plugins/p2p"]
resolver = "2"

[package]
name = "amitoki"
default-run = "amitoki"
version = "0.4.0"
authors = ["相田 優希 <51500566+aida0710@users.noreply.github.com>"]
edition = "2021"

[dependencies]
async-trait = "0.1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
dotenv = "0.15"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
amitoki-relay = { path = "crates/relay" }
amitoki-relay-memory = { path = "plugins/memory" }
amitoki-plugin-sdk = { path = "crates/plugin-sdk" }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
uuid = { version = "1", features = ["v4"] }

[[bench]]
name = "packet_pipeline"
harness = false

[[bin]]
name = "amitoki-test-plugin"
path = "tests/fixtures/plugin.rs"
test = false

[[bin]]
name = "amitoki-test-block"
path = "tests/fixtures/block.rs"
test = false
